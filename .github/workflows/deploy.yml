name: Deploy CloudDabba to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: learn-nodejs
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: GH_PAT
          script: |
            set -e

            APP_DIR="/home/learn-nodejs/htdocs/clouddabba"
            cd "$APP_DIR"

            echo "=== Step 1: Pull latest code ==="
            git remote set-url origin "https://${GH_PAT}@github.com/niteshpawar97/CloudDabba.git"
            git fetch origin master
            git reset --hard origin/master
            echo "Pulled: $(git log --oneline -1)"

            echo "=== Step 2: Copy env if needed ==="
            cp -n .env.production backend/.env 2>/dev/null || true

            echo "=== Step 3: Backend build ==="
            cd "$APP_DIR/backend"

            # Sanity check: if a previous root-owned run polluted node_modules,
            # later prisma generate / npm install will fail with EACCES on
            # unlink. Bail early with a clear fix command instead of crashing
            # mid-build with an opaque error.
            if [ -d node_modules ] && [ ! -w node_modules ]; then
              echo "ERROR: node_modules is not writable by $(whoami)."
              echo "Looks like a previous build ran as root. Fix once on the VPS:"
              echo ""
              echo "  sudo chown -R learn-nodejs:learn-nodejs $APP_DIR"
              echo ""
              exit 1
            fi

            npm install --production=false
            npx prisma generate
            npx prisma db push --skip-generate
            npm run build

            if [ ! -f "$APP_DIR/backend/dist/server.js" ]; then
              echo "ERROR: Backend build failed - dist/server.js not found"
              exit 1
            fi
            echo "Backend build OK"

            echo "=== Step 4: Frontend build ==="
            cd "$APP_DIR/frontend"
            npm install
            npm run build

            if [ ! -f "$APP_DIR/frontend/dist/index.html" ]; then
              echo "ERROR: Frontend build failed - dist/index.html not found"
              exit 1
            fi
            echo "Frontend build OK"

            echo "=== Step 5: Restart backend ==="
            pm2 restart clouddabba-api --update-env 2>/dev/null || pm2 start "$APP_DIR/ecosystem.config.js"
            sleep 2

            if pm2 show clouddabba-api | grep -q "online"; then
              echo "PM2 status: online"
            else
              echo "WARNING: PM2 process may not be running"
              pm2 logs clouddabba-api --lines 10 --nostream
            fi

            echo "=== Deploy complete! ==="
            echo "Commit: $(cd "$APP_DIR" && git log --oneline -1)"
