# Wildcard subdomain handler with SSL
# Admin ko ye file /etc/nginx/sites-enabled/ me copy karni hai
# sudo cp /home/learn-nodejs/htdocs/clouddabba/nginx/wildcard-ssl.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name *.cloud.niketgroup.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.cloud.niketgroup.com;

    ssl_certificate /etc/letsencrypt/live/cloud.niketgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.niketgroup.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:6050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
